# Python and HTML checks. Docker execution will be added next.
name: Task Manager CI

on:
  push:
    branches:
      - main
      - feature/task-manager-pipeline

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run task manager
        run: python .github/scripts/todo.py | tee task-output.txt

      - name: Run unit tests
        run: python .github/scripts/todo-test.py | tee test-output.txt

      - name: Update HTML report
        run: bash .github/scripts/update_index.sh task-output.txt test-output.txt

      - name: Show HTML report
        run: cat index.html
